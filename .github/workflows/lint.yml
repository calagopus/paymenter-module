name: Lint

on:
  pull_request:
  push:
    branches:
      - main

env:
  PAYMENTER_REF: "v1.5.7"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: module

      - name: Checkout Paymenter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Paymenter/paymenter
          ref: ${{ env.PAYMENTER_REF }}
          path: paymenter

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: bcmath, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('paymenter/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: paymenter

      - name: Stage extension into Paymenter
        run: |
          cp -r module/extensions/Servers/Calagopus paymenter/extensions/Servers/Calagopus
          cp module/phpstan.neon paymenter/phpstan-calagopus.neon

      - name: Run Pint
        run: vendor/bin/pint --test extensions/Servers/Calagopus
        working-directory: paymenter

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan-calagopus.neon --no-progress --memory-limit=1G
        working-directory: paymenter
